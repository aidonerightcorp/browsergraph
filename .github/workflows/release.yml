name: Release

on:
  push: {tags: ["v*"]}
  workflow_dispatch:

permissions: {contents: write, packages: write}

jobs:
  # Build it, prove it installs, attach it to the release. Distribution is this
  # repository and the container registry — deliberately not PyPI, so there is
  # no third-party account in the path and no credential to keep alive. An
  # earlier version attempted a best-effort upload and warned on every tag that
  # it had been skipped, which made a working release look half-finished.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install build
      - run: python -m build
      # Install the wheel in a clean environment before offering it to anyone.
      # A package that builds and does not import is worse than no package: the
      # failure lands on a stranger's machine instead of in this log.
      - name: Verify the wheel installs and works
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --quiet dist/*.whl
          /tmp/fresh/bin/python - <<'PY'
          import browsergraph as bg
          from browsergraph.demo import workbench
          from browsergraph.studio import template
          assert bg.__version__, "no version"
          assert workbench().validate() == [], "demo does not validate"
          assert len(template()) > 1000, "studio template not packaged"
          print(f"browsergraph {bg.__version__} installs clean:", workbench().summary())
          PY
          /tmp/fresh/bin/browsergraph capabilities > /dev/null

      # Checksums alongside the artifacts, so anyone downloading a wheel from a
      # release page can confirm they got the one this run built.
      - name: Checksum the artifacts
        run: cd dist && sha256sum * | tee SHA256SUMS

      # Attach the verified wheel to the GitHub release, so `pip install <url>`
      # works the moment the tag lands.
      - name: Attach artifacts to the release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
