name: Release

on:
  push: {tags: ["v*"]}
  workflow_dispatch:

permissions: {contents: write, packages: write, id-token: write}

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install build
      - run: python -m build
      # The build must succeed; publishing is allowed not to.
      #
      # Trusted publishing means no long-lived token is stored in this repo — but
      # it has to be registered on PyPI first, and until it is, every tag would
      # fail this workflow and make a healthy project look broken. The upload is
      # therefore best-effort and the outcome is reported explicitly.
      - id: publish
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Report publish outcome
        run: |
          if [ "${{ steps.publish.outcome }}" = "success" ]; then
            echo "::notice::published to PyPI"
          else
            echo "::warning::PyPI upload skipped — register a trusted publisher at" \
                 "https://pypi.org/manage/account/publishing/ with owner=${{ github.repository_owner }}," \
                 "repository=browsergraph, workflow=release.yml, environment=release."
          fi
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
