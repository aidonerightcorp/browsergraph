name: Release

on:
  push: {tags: ["v*"]}
  workflow_dispatch:

permissions: {contents: write, packages: write, id-token: write}

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install build
      - run: python -m build
      # The build must succeed; publishing is allowed not to.
      #
      # Trusted publishing means no long-lived token is stored in this repo — but
      # it has to be registered on PyPI first, and until it is, every tag would
      # fail this workflow and make a healthy project look broken. The upload is
      # therefore best-effort and the outcome is reported explicitly.
      # Install the wheel in a clean environment before offering it to anyone.
      # A package that builds and does not import is worse than no package: the
      # failure lands on a stranger's machine instead of in this log.
      - name: Verify the wheel installs and works
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --quiet dist/*.whl
          /tmp/fresh/bin/python - <<'PY'
          import browsergraph as bg
          from browsergraph.demo import workbench
          from browsergraph.studio import template
          assert bg.__version__, "no version"
          assert workbench().validate() == [], "demo does not validate"
          assert len(template()) > 1000, "studio template not packaged"
          print(f"browsergraph {bg.__version__} installs clean:", workbench().summary())
          PY
          /tmp/fresh/bin/browsergraph capabilities > /dev/null

      # Two auth paths, because only one of them can be set up without a human
      # visiting PyPI. Trusted publishing is preferred — no long-lived secret
      # lives in this repository — but until it is registered, a PYPI_API_TOKEN
      # secret works, and if neither exists the upload is skipped rather than
      # failing the release. A tag should never make a healthy project look
      # broken because of a credential nobody has created yet.
      - id: publish-trusted
        if: ${{ !secrets.PYPI_API_TOKEN }}
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
      - id: publish-token
        if: ${{ secrets.PYPI_API_TOKEN }}
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
      - name: Report publish outcome
        run: |
          if [ "${{ steps.publish-trusted.outcome }}" = "success" ] \
          || [ "${{ steps.publish-token.outcome }}" = "success" ]; then
            echo "::notice::published to PyPI"
          else
            echo "::warning::PyPI upload skipped. Either register a trusted publisher at" \
                 "https://pypi.org/manage/account/publishing/ (owner=${{ github.repository_owner }}," \
                 "repository=browsergraph, workflow=release.yml, environment=release), or add a" \
                 "PYPI_API_TOKEN repository secret. The wheel is attached to the GitHub release" \
                 "either way, and 'pip install <release-url>' works today."
          fi

      # The equivalent that needs no third-party account: attach the verified
      # wheel to the GitHub release, so `pip install <url>` works immediately.
      - name: Attach artifacts to the release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
